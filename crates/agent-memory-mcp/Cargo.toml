[package]
name = "agent-memory-mcp"
description = "Local MCP server exposing the semantic memory layer to any MCP-capable agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-memory-client.workspace = true
agent-memory-core.workspace = true
anyhow.workspace = true
rmcp = { workspace = true, features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
agent-memory-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
